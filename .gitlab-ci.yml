image: maven:4.0.0-rc-5-ibm-semeru-25-noble

stages:
  - test
  - package

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Job test
test:
  stage: test
  script:
    - mvn clean test

# Create a jar package only on the main branch (useful to give a .jar to the client)
package:
  stage: package
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG == "test/release-build"'
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 7 days
