image: maven:3.9.9-eclipse-temurin-21

stages:
  - lint
  - test
  - package

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

check-format:
  stage: lint
  script:
    - mvn $MAVEN_OPTS spotless:check
  allow_failure: false

check-lint:
  stage: lint
  script:
    - mvn $MAVEN_OPTS checkstyle:check
  allow_failure: true

# Job test
test:
  stage: test
  script:
    - mvn clean test
  artifacts:
    paths:
      - target/surefire-reports/
    expire_in: 7 days
    when: always

# Create a jar package only on the main branch (useful to give a .jar to the client)
package:
  stage: package
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 7 days
